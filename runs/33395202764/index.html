
<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <title>
    Predixtions Admin Automation
  </title>


  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 50px;
    }


    .container {
      max-width: 1000px;
      margin: auto;
    }


    .card {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }


    h1 {
      color: #1a1a2e;
      text-align: center;
    }


    .info {
      color: #666;
      margin: 10px 0;
    }


    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 30px;
    }


    .stat {
      flex: 1;
      min-width: 130px;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }


    .number {
      font-size: 32px;
      font-weight: bold;
      margin-top: 8px;
    }


    .total {
      background: #eaf2ff;
    }


    .passed {
      background: #e9f8ef;
    }


    .failed {
      background: #fdecec;
    }


    .flaky {
      background: #fff5d6;
    }


    .skipped {
      background: #eeeeee;
    }


    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 28px;
      background: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }


    .center {
      text-align: center;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="card">

      <h1>
        🎭 Predixtions Admin Automation
      </h1>


      <h2 style="text-align:center;">
        📊 Automation Result
      </h2>


      <p class="info">
        Environment:
        <strong>
          QA
        </strong>
      </p>


      <p class="info">
        Branch:
        <strong>
          main
        </strong>
      </p>


      <p class="info">
        Run ID:
        <strong>
          33395202764
        </strong>
      </p>


      <p class="info">
        Run Number:
        <strong>
          #4
        </strong>
      </p>


      <!-- TEST STATS -->

      <div class="stats">


        <div class="stat total">

          <div>
            Total
          </div>

          <div class="number">
            47
          </div>

        </div>


        <div class="stat passed">

          <div>
            Passed
          </div>

          <div class="number">
            44
          </div>

        </div>


        <div class="stat failed">

          <div>
            Failed
          </div>

          <div class="number">
            3
          </div>

        </div>


        <div class="stat flaky">

          <div>
            Flaky
          </div>

          <div class="number">
            0
          </div>

        </div>


        <div class="stat skipped">

          <div>
            Skipped
          </div>

          <div class="number">
            0
          </div>

        </div>


      </div>


      <div class="center">

        <a
          class="button"
          href="./allure/index.html"
          target="_blank">

          📈 Open Allure Report

        </a>

      </div>


    </div>

  </div>

</body>

</html>
